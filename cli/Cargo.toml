[package]
name = "dynrinth-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "dynrinth"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
url = "2.5"
